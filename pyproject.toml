[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiproxy"
version = "0.2.0"
description = "Universal AI API proxy with per-request billing, key management and usage tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "httpx[http2]>=0.27",
    "orjson>=3.10",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools]
packages = ["aiproxy", "aiproxy.connectors", "aiproxy.opossum"]

[tool.setuptools.package-data]
aiproxy = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal:sqlalchemy.exc.SAWarning"]
