[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiproxy"
version = "0.1.0"
description = "Universal AI API proxy with per-request billing, key management and usage tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[tool.setuptools]
packages = ["aiproxy", "aiproxy.connectors"]

[tool.setuptools.package-data]
aiproxy = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Dialect sqlite\\+aiosqlite does \\*not\\* support Decimal:sqlalchemy.exc.SAWarning"]
